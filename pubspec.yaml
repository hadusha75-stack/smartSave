name: savesmart
description: SaveSmart - A savings goal tracker and motivator for students and young workers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.1.3

  # State management
  get: ^4.6.6

  # Navigation
  go_router: ^14.2.7

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # Localization / formatting
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.5.1

  # Icons (used for goal categories)
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  # fonts:
  #   - family: NotoSansEthiopic
  #     fonts:
  #       - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
  #         weight: 700

  generate: true  # Enables generated localization files from ARB

# ── App launcher icon configuration ──────────────────────────────────────────
# Run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
